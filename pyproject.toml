[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-structure-mcp"
version = "0.1.0"
description = "Minecraft Java structure NBT editing tools over MCP"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "nbtlib>=2,<3"]

[project.scripts]
minecraft-structure-mcp = "minecraft_structure_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minecraft_structure_mcp = ["data/*.json"]

